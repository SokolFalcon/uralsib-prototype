<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#391453"><title>Просмотр прототипа</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 80% 20%,#73358f 0,transparent 55%),#29113f;font:16px/1.5 Arial,sans-serif;color:#180b26}.card{width:100%;max-width:420px;padding:36px;background:#fff;border-radius:32px;box-shadow:0 24px 80px #15082040}.lock{width:52px;height:52px;background:#f1eaf8;border-radius:18px;display:grid;place-items:center;margin-bottom:24px;color:#41036a}.lock svg{width:28px;height:28px}h1{font-size:26px;line-height:1.2;margin:0 0 12px;font-weight:600}p{color:#766b7d;margin:0 0 28px;font-size:15px}label{display:block;font-size:14px;margin-bottom:8px}.input{display:flex;border:1px solid #d9d2df;border-radius:14px;overflow:hidden}.input:focus-within{border-color:#6d37d1;box-shadow:0 0 0 3px #6d37d119}input{font:inherit;border:0;outline:0;min-width:0;width:100%;padding:13px 14px}button{font:inherit;cursor:pointer;border:0}.reveal{background:white;color:#6d37d1;padding:0 12px;font-size:13px}.submit{display:block;width:100%;padding:14px;background:#41036a;color:white;border-radius:14px;margin-top:20px;font-weight:600}.submit:hover{background:#5b1685}.submit:disabled{opacity:.6;cursor:wait}button:focus-visible{outline:3px solid #a783df;outline-offset:3px}.message{min-height:22px;color:#c32544;margin-top:12px;font-size:14px}.message.busy{color:#766b7d}.foot{margin:16px 0 0;text-align:center;font-size:12px;color:#9c939f}@media(max-width:420px){.card{padding:28px 24px}body{padding:16px}h1{font-size:24px}}</style>
<script src="unlock.js" defer></script></head><body><main class="card"><div class="lock" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4.5" y="10" width="15" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div><h1>Просмотр прототипа</h1><p>Введите пароль, который вам передали вместе со ссылкой.</p><form id="unlock-form"><label for="password">Пароль</label><div class="input"><input id="password" name="password" type="password" required autocomplete="off" autocapitalize="none" spellcheck="false" autofocus><button class="reveal" type="button" id="reveal" aria-label="Показать пароль" aria-pressed="false">Показать</button></div><button class="submit" type="submit" id="submit">Открыть прототип</button><div class="message" id="message" role="status" aria-live="polite"></div></form><p class="foot">Доступ по приглашению</p></main></body></html>
